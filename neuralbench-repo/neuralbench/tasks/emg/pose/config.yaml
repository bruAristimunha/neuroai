# emg/pose regression task: surface-EMG → hand joint angles (Emg2pose, NM000281).
# Cross-user baseline: the paper's held-out-user condition, expressed as a
# leave-subjects-out split over the BIDS ``user`` column that the study reads
# from ``participants.tsv``.

data:
  batch_size: 16
  study:
    source:
      name: Emg2pose
    split:
      # The paper's own train/val/test assignment, joined onto each recording
      # from the upstream ``emg2pose_metadata.csv`` via the HDF5 name the BIDS
      # sidecars preserve as ``SourceFile``.  ``valid_split_by: null`` keeps
      # the published ``val`` rows instead of re-drawing a validation set out
      # of train.  Test rows carry ``generalization`` in {user, stage,
      # user_stage}, so per-condition numbers come out of the aggregation.
      name: PredefinedSplit
      event_type: Emg2poseRecording
      test_split_query: null
      col_name: split
      valid_split_by: null
  # No filter / notch / baseline / scaler / clamp: the paper feeds raw 2 kHz
  # EMG straight to the model, same convention as ``emg/typing``.
  neuro:
    =replace=: true
    name: EmgExtractor
    picks: [emg]
    frequency: 2000.0
    filter: null
    notch_filter: null
    baseline: null
    scaler: null
    clamp: null
    infra:
      cluster: auto
      folder: !!python/name:neuralbench.config_manager.CACHE_DIR
      keep_in_ram: true
      slurm_partition: !!python/name:neuralbench.config_manager.SLURM_PARTITION
      timeout_min: 180
      gpus_per_node: 1
      cpus_per_task: 10
      min_samples_per_job: 200
  target:
    =replace=: true
    # The 20 joint angles are MISC channels in the same BDF as the EMG, so the
    # target is the same reader restricted to those channels.  The paper
    # regresses a whole trajectory, not a single pose, so this stays dense in
    # time; ``TimeMajorExtractor`` puts it in (T, C) to match the backbone's
    # per-frame output, because the loss flattens both to (batch, -1).
    name: TimeMajorExtractor
    extractor:
      name: EmgExtractor
      event_types: Emg
      picks: [misc]
      frequency: 2000.0
      # Two corrections in one factor.  The BDF physical header declares
      # ``uV`` for all 36 channels, so MNE returns the joint channels 1e6
      # times too small; ``* 1e6`` restores radians.  ``* 180 / pi`` then
      # converts to degrees, which is what the paper reports angular error in
      # (Section 3.3), so ``val/mae`` is directly readable against Table 2.
      scale_factor: 57295779.51308232
      filter: null
      notch_filter: null
      baseline: null
      scaler: null
      clamp: null
  # The paper evaluates 5-s trajectories (10,000 samples at 2 kHz).  Windows
  # tile each event without overlap; a span shorter than one window is dropped.
  # Events are the contiguous runs of resolved inverse kinematics, so no window
  # spans an IK failure -- nor the zero padding that brings every BDF up to a
  # whole number of one-second records, which the same all-zero test catches.
  trigger_event_type: Emg2poseRecording
  start: 0.0
  duration: 5.0
  stride: 5.0
  stride_drop_incomplete: true
  summary_columns: [user, stage, side, generalization]
brain_model_output_size: &brain_model_output_size 20
# The paper's regression setting is a plain sequence-to-sequence map --
# ``PoseModule._predict_pose`` is ``pred = self.network(emg)``, with no state
# conditioning and no initial pose (``regression_neuropose.yaml``).  The
# default backbone is therefore a dense per-frame regressor; models that do not
# override ``brain_model_config`` inherit it rather than the global EEGNet
# default, whose single-vector output cannot express a trajectory.
brain_model_config:
  =replace=: true
  name: NeuroPoseNet
  kwargs:
    n_bands: 16
    internal_sfreq: 200.0
trainer_config:
  monitor: val/mae
  mode: min
  strategy: auto
  patience: 7
  n_epochs: 40
loss:
  name: MSELoss
metrics: !!python/object/apply:neuralbench.defaults.metrics.get_regression_metric_configs
  - *brain_model_output_size
