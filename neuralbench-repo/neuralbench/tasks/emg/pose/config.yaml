# emg/pose: surface-EMG -> hand joint-angle trajectories (Salter2024Emg2pose,
# NEMAR NM000281), following the paper's regression setting.

data:
  batch_size: 16
  study:
    source:
      name: Salter2024Emg2pose
    split:
      name: PredefinedSplit
      event_type: BidsEmg
      test_split_query: null
      col_name: split
      valid_split_by: null
  # No filter / notch / baseline / scaler / clamp: the paper feeds raw 2 kHz
  # EMG straight to the model, same convention as ``emg/typing``.
  neuro:
    =replace=: true
    name: EmgExtractor
    picks: [emg]
    frequency: 2000.0
    filter: null
    notch_filter: null
    baseline: null
    scaler: null
    clamp: null
    infra:
      cluster: auto
      folder: !!python/name:neuralbench.config_manager.CACHE_DIR
      keep_in_ram: true
      slurm_partition: !!python/name:neuralbench.config_manager.SLURM_PARTITION
      timeout_min: 180
      gpus_per_node: 1
      cpus_per_task: 10
      min_samples_per_job: 200
  target:
    =replace=: true
    # The 20 joint angles are MISC channels in the same BDF as the EMG.
    # Transposed to (T, C) to match the backbone's per-frame output, because
    # the loss flattens both to (batch, -1).
    name: TimeMajorExtractor
    extractor:
      name: EmgExtractor
      picks: [misc]
      frequency: 2000.0
      filter: null
      notch_filter: null
      baseline: null
      scaler: null
      # Joint labels are radians; report the paper's degree-based metrics.
      scale_factor: 57.29577951308232
      clamp: null
  # 5-s trajectories, the paper's evaluation length.
  trigger_event_type: BidsEmg
  start: 0.0
  duration: 5.0
  stride: 5.0
  stride_drop_incomplete: true
  summary_columns: [user, stage, side, generalization]
brain_model_output_size: &brain_model_output_size 20
brain_model_config:
  =replace=: true
  name: NeuroPose
trainer_config:
  monitor: val/mae
  mode: min
  strategy: auto
  patience: 7
  n_epochs: 40
loss:
  name: MSELoss
metrics: !!python/object/apply:neuralbench.defaults.metrics.get_regression_metric_configs
  - *brain_model_output_size
